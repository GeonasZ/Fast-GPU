<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>登录 · Fast GPU</title>
  <link rel="stylesheet" href="/auth.css">
</head>
<body>
  <main class="auth-shell">
    <section class="auth-intro">
      <span class="logo">G</span>
      <p class="eyebrow">Fast GPU WEB</p>
      <h1>统一管理你的 GPU 算力</h1>
      <p>登录 Web 控制面后，浏览器版和 Client 版会使用同一个账户与会话。</p>
    </section>
    <section class="auth-card">
      <div class="tabs" role="tablist">
        <button id="loginTab" class="active" type="button">登录</button>
        <button id="registerTab" type="button">注册</button>
      </div>
      <form id="authForm">
        <label id="nameField" hidden>名称<input id="displayName" autocomplete="name" minlength="2" maxlength="60"></label>
        <label>邮箱<input id="email" type="email" autocomplete="email" required></label>
        <label>密码<input id="password" type="password" autocomplete="current-password" minlength="10" required></label>
        <p id="passwordHint">使用你注册时设置的密码。</p>
        <div id="authError" role="alert"></div>
        <button id="submitAuth" class="primary" type="submit">登录</button>
      </form>
    </section>
  </main>
  <script src="/auth.js"></script>
</body>
</html>
