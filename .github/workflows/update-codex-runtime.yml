name: Publish default runtime image

on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

concurrency:
  group: runtime-images
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RUNTIME_VERSION: "26.03"
      RUNTIME_BASE: nvcr.io/nvidia/pytorch:26.03-py3
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish candidate
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.runtime
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}-runtime:candidate-${{ env.RUNTIME_VERSION }}-${{ github.run_id }}
          build-args: NGC_IMAGE=${{ env.RUNTIME_BASE }}
          labels: |
            io.gpu-fleet.pytorch.version=${{ env.RUNTIME_VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test candidate image
        shell: bash
        run: |
          set -Eeuo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}-runtime@${{ steps.build.outputs.digest }}"
          docker pull "$image"
          docker run --rm --entrypoint /opt/gpu-fleet/verify-image.sh "$image"

      - name: Promote tested digest
        shell: bash
        run: |
          set -Eeuo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}-runtime"
          tags=(--tag "${image}:pytorch-2.11-cuda13.2-ngc26.03" --tag "${image}:stable-cuda13")
          docker buildx imagetools create "${tags[@]}" "${image}@${{ steps.build.outputs.digest }}"
